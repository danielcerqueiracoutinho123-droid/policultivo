<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Policultiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Lexend:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8f5; --bg2:#eaf3ec; --fg:#0e1a14; --card:#ffffff; --muted:#66766c; --border:#e2eae4;
  --primary:#047857; --primary2:#10b981; --primary-fg:#ffffff; --amber:#b45309; --amberbg:#fef3c7;
  --blue:#1d4ed8; --bluebg:#dbeafe; --red:#b91c1c; --redbg:#fee2e2; --greenbg:#d1fae5;
  --radius:16px; --shadow:0 1px 2px rgba(15,30,20,.04), 0 8px 24px rgba(15,30,20,.06);
  --shadow-lg:0 10px 30px rgba(4,120,87,.18);
  --font-body:'Manrope',ui-sans-serif,system-ui,sans-serif; --font-head:'Lexend',var(--font-body);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0a1210; --bg2:#0d1815; --fg:#eef4f0; --card:#131f1a; --muted:#8ea298; --border:#1f2e27; --amberbg:#3a2c0e; --bluebg:#152238; --redbg:#3a1414; --greenbg:#0f2b1f; --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); }
}
:root[data-theme="dark"]{ --bg:#0a1210; --bg2:#0d1815; --fg:#eef4f0; --card:#131f1a; --muted:#8ea298; --border:#1f2e27; --amberbg:#3a2c0e; --bluebg:#152238; --redbg:#3a1414; --greenbg:#0f2b1f; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
    radial-gradient(1200px 500px at 100% -10%, rgba(16,185,129,.10), transparent 60%),
    radial-gradient(900px 400px at -10% 0%, rgba(4,120,87,.08), transparent 55%),
    var(--bg);
  color:var(--fg);font-family:var(--font-body);letter-spacing:.1px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--font-head)}
header{background:linear-gradient(120deg,#065f46,#059669 55%,#10b981);color:#fff;padding:22px 16px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:10;box-shadow:var(--shadow-lg)}
header .inner{display:flex;align-items:center;gap:14px}
header .logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  border:1px solid rgba(255,255,255,.25)}
header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.92}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px}
nav.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:5px;margin-bottom:18px;overflow-x:auto;box-shadow:var(--shadow)}
nav.tabs button{flex:1;min-width:96px;border:none;background:transparent;color:var(--muted);
  padding:10px 8px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  font-family:var(--font-body);transition:background .15s,color .15s}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;
  box-shadow:0 4px 14px rgba(5,150,105,.35)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{letter-spacing:.1px}
.grid{display:grid;gap:12px}
.grid.cols2{grid-template-columns:1fr 1fr}
.grid.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:640px){.grid.cols3{grid-template-columns:1fr 1fr}.grid.cols2{grid-template-columns:1fr}}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;letter-spacing:.2px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);
  color:var(--fg);font-size:14px;margin-bottom:12px;font-family:var(--font-body);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--primary2);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
button.btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:var(--primary-fg);border:none;
  padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;font-family:var(--font-body);
  box-shadow:0 4px 14px rgba(5,150,105,.3);transition:transform .12s,box-shadow .12s}
button.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(5,150,105,.4)}
button.btn:active{transform:translateY(0)}
button.btn.secondary{background:var(--card);color:var(--fg);border:1px solid var(--border);box-shadow:none}
button.btn.secondary:hover{box-shadow:none;background:var(--bg)}
button.btn.small{padding:7px 12px;font-size:12.5px}
.badge{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:99px;font-weight:700;letter-spacing:.2px}
.badge.ok{background:var(--greenbg);color:var(--primary)}
.badge.low{background:var(--amberbg);color:var(--amber)}
.badge.high{background:var(--bluebg);color:var(--blue)}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stat{padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.stat .ico{font-size:18px;opacity:.85}
.stat b{display:block;font-size:19px;font-family:var(--font-head);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin:8px 0}
.bar>div{height:100%;transition:width .2s}
a.linklike{color:var(--primary);cursor:pointer;text-decoration:none;font-size:12.5px;font-weight:600}
a.linklike:hover{text-decoration:underline}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 16px;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.hidden{display:none}
.tipbox{background:var(--bluebg);border:1px solid rgba(29,78,216,.25);color:var(--fg);border-radius:14px;
  padding:12px 14px;font-size:13px;margin-bottom:16px;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- dados locais (sem backend, sem Base44) ----------
const K = {farm:'pc_farm', fields:'pc_fields', crops:'pc_crops', devices:'pc_devices', tx:'pc_tx'};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let state = {
  farm: load(K.farm, null),
  fields: load(K.fields, []),
  crops: load(K.crops, []),
  devices: load(K.devices, []),
  tx: load(K.tx, []),
  tab: 'overview',
};
const persist = () => { save(K.farm,state.farm); save(K.fields,state.fields); save(K.crops,state.crops); save(K.devices,state.devices); save(K.tx,state.tx); };

const SOIL = {arenoso:'Arenoso',argiloso:'Argiloso',siltoso:'Siltoso',franco:'Franco',organico:'Orgânico'};
function humidityStatus(c){ const h=+c.humidity||0,min=+c.min_humidity||0,max=+c.max_humidity||100; if(h<min)return'low'; if(h>max)return'high'; return'ok'; }
function targetHumidity(c){ return Math.round(((+c.min_humidity||0)+(+c.max_humidity||100))/2); }

// ---------- ESP32 ----------
const espBase = ip => `http://${ip.replace(/^https?:\/\//,'')}`;
async function espStatus(ip){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),5000);
  try{ const r=await fetch(espBase(ip)+'/status',{signal:ctrl.signal}); if(!r.ok) throw new Error('ESP32 respondeu '+r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function espRelay(ip, on){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),5000);
  try{ await fetch(espBase(ip)+'/relay',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({state:on?1:0})}); }
  finally{ clearTimeout(t); }
}

// ---------- render ----------
const root = document.getElementById('app');
function render(){ root.innerHTML = state.farm ? appShell() : onboarding(); wire(); }

function onboarding(){
  return `<div class="wrap" style="max-width:460px;padding-top:64px">
    <div style="text-align:center;margin-bottom:18px">
      <div style="width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#047857,#10b981);
        display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px;box-shadow:var(--shadow-lg)">🌱</div>
      <h2 style="margin:0;font-size:22px">Bem-vindo à Policultiva</h2>
      <p class="muted" style="margin:6px 0 0">Conte um pouco sobre sua terra pra começar.</p>
    </div>
    <div class="card">
      <form id="farmForm">
        <label>Seu nome</label><input name="farmer_name" required placeholder="Ex: João Silva">
        <label>Nome da fazenda/sítio</label><input name="farm_name" required placeholder="Ex: Sítio Boa Vista">
        <label>Cidade</label><input name="city" required placeholder="Ex: Castanhal">
        <label>Estado</label><input name="state" required placeholder="Ex: Pará">
        <label>Área total (hectares)</label><input name="area_hectares" type="number" step="0.1" min="0" required>
        <button class="btn" style="width:100%" type="submit">Começar a usar 🌱</button>
      </form>
    </div>
  </div>`;
}

const TABS = [
  ['overview','📊','Visão geral'], ['recommendations','✨','Recomendações'], ['irrigation','💧','Irrigação'],
  ['devices','📶','Dispositivos'], ['finance','💰','Financeiro'], ['crops','🌾','Culturas'],
];
function appShell(){
  return `
  <header><div class="wrap inner" style="padding:0">
    <div class="logo">🌱</div>
    <div>
      <h1>Policultiva</h1>
      <p>Olá, ${state.farm.farmer_name.split(' ')[0]}! ${state.farm.farm_name}</p>
    </div>
  </div></header>
  <div class="wrap">
    <nav class="tabs">${TABS.map(([k,ic,l])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${ic} ${l}</button>`).join('')}</nav>
    <div id="tabContent">${renderTab()}</div>
  </div>
  <footer>Projeto PoliCultiva — Escola Sesi Castanhal · <span id="wipeLink" class="linklike">apagar todos os dados</span></footer>`;
}
function renderTab(){
  if(state.tab==='overview') return tabOverview();
  if(state.tab==='recommendations') return tabRecommendations();
  if(state.tab==='irrigation') return tabIrrigation();
  if(state.tab==='devices') return tabDevices();
  if(state.tab==='finance') return tabFinance();
  if(state.tab==='crops') return tabCrops();
  return '';
}

function tabOverview(){
  const totalArea = state.fields.reduce((s,f)=>s+(+f.area_hectares||0),0);
  const alerts = state.crops.filter(c=>humidityStatus(c)!=='ok').length;
  const rec=state.tx.reduce((s,t)=>t.type==='receita'?s+(+t.amount||0):s,0);
  const desp=state.tx.reduce((s,t)=>t.type==='despesa'?s+(+t.amount||0):s,0);
  return `
  <div class="grid cols3" style="margin-bottom:14px">
    <div class="stat"><span class="ico">🗺️</span><span class="muted">Área total</span><b>${totalArea.toFixed(1)} ha</b></div>
    <div class="stat"><span class="ico">🌾</span><span class="muted">Culturas</span><b>${state.crops.length}</b></div>
    <div class="stat"><span class="ico">⚠️</span><span class="muted">Alertas</span><b>${alerts}</b></div>
    <div class="stat"><span class="ico">📶</span><span class="muted">Dispositivos</span><b>${state.devices.length}</b></div>
    <div class="stat"><span class="ico">💰</span><span class="muted">Saldo</span><b style="color:${rec-desp>=0?'var(--primary)':'var(--red)'}">R$ ${(rec-desp).toFixed(2)}</b></div>
    <div class="stat"><span class="ico">📍</span><span class="muted">Talhões</span><b>${state.fields.length}</b></div>
  </div>
  <div class="card">
    <div class="row"><h3 style="margin:0">Talhões</h3><button class="btn small" id="addFieldBtn">+ Talhão</button></div>
    <div id="fieldForm" class="hidden">${fieldFormHtml()}</div>
    ${state.fields.length===0?'<p class="muted">Nenhum talhão cadastrado ainda.</p>':state.fields.map(f=>`
      <div class="row" style="border-top:1px solid var(--border);padding:10px 0">
        <div><b>${f.name}</b><div class="muted">${f.area_hectares} ha · ${SOIL[f.soil_type]||f.soil_type} · ${f.region||''}</div></div>
        <span class="linklike" data-del-field="${f.id}">remover</span>
      </div>`).join('')}
  </div>`;
}

function fieldFormHtml(){
  return `<form id="fieldFormEl" style="border-top:1px solid var(--border);padding-top:12px;margin-top:8px">
    <div class="grid cols2">
      <div><label>Nome do talhão</label><input name="name" required></div>
      <div><label>Região</label><input name="region" required></div>
      <div><label>Área (ha)</label><input name="area_hectares" type="number" step="0.01" min="0" required></div>
      <div><label>Tipo de solo</label><select name="soil_type">${Object.entries(SOIL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    </div>
    <label>Água disponível (litros)</label><input name="water_available_liters" type="number" min="0" required>
    <button class="btn" type="submit">Salvar talhão</button>
  </form>`;
}

function tabRecommendations(){
  const low = state.crops.filter(c=>humidityStatus(c)==='low');
  const high = state.crops.filter(c=>humidityStatus(c)==='high');
  const cards=[];
  if(low.length) cards.push({icon:'💧',title:'Regar hoje',text:`${low.map(c=>c.name).join(', ')} com umidade baixa. Regue até ~${targetHumidity(low[0])}%.`});
  if(high.length) cards.push({icon:'🌊',title:'Drenar hoje',text:`${high.map(c=>c.name).join(', ')} com umidade alta. Evite novas regas.`});
  if(!low.length && !high.length && state.crops.length) cards.push({icon:'✅',title:'Tudo certo',text:'Todas as culturas com umidade ideal. Bom momento para capinar.'});
  if(!state.crops.length) cards.push({icon:'🌱',title:'Plantar',text:'Nenhuma cultura cadastrada. Cadastre um talhão e plante para receber dicas.'});
  return `<div class="tipbox">Dica: sem previsão do tempo automática nesta versão — confira o tempo local antes de regar/drenar em grande volume.</div>
    <div class="grid cols2">${cards.map(c=>`<div class="card"><h3 style="margin:0 0 6px">${c.icon} ${c.title}</h3><p class="muted" style="margin:0">${c.text}</p></div>`).join('')}</div>`;
}

function tabIrrigation(){
  return `<div class="row" style="margin-bottom:12px"><h3 style="margin:0">Culturas</h3><button class="btn small" id="addCropBtn2">+ Cultura</button></div>
  <div id="cropForm2" class="hidden">${cropFormHtml()}</div>
  <div class="grid cols2">${state.crops.map(cropCard).join('') || '<p class="muted">Nenhuma cultura cadastrada.</p>'}</div>`;
}
function cropCard(c){
  const st=humidityStatus(c);
  const color = st==='low'?'var(--amber)':st==='high'?'var(--blue)':'var(--primary)';
  const badge = st==='low'?'<span class="badge low">Baixa</span>':st==='high'?'<span class="badge high">Alta</span>':'<span class="badge ok">Ideal</span>';
  return `<div class="card">
    <div class="row"><b>${c.name}</b>${badge}</div>
    <p class="muted" style="margin:4px 0">${c.variety||''}</p>
    <div class="row"><span style="font-size:22px;font-weight:700">${c.humidity}%</span><span class="muted">Ideal ${c.min_humidity}–${c.max_humidity}%</span></div>
    <div class="bar"><div style="width:${Math.min(100,Math.max(0,c.humidity))}%;background:${color}"></div></div>
    <input type="range" min="0" max="100" value="${c.humidity}" data-humidity="${c.id}" style="margin:8px 0">
    <div class="row"><span class="linklike" data-resolve="${c.id}">Resolver (ideal)</span><span class="linklike" data-del-crop="${c.id}">remover</span></div>
  </div>`;
}
function cropFormHtml(){
  if(!state.fields.length) return '<p class="muted">Cadastre um talhão antes de adicionar culturas.</p>';
  return `<form class="cropFormEl" style="margin-bottom:14px">
    <label>Talhão</label><select name="field_id">${state.fields.map(f=>`<option value="${f.id}">${f.name}</option>`).join('')}</select>
    <div class="grid cols2">
      <div><label>Cultura</label><input name="name" required></div>
      <div><label>Variedade</label><input name="variety"></div>
      <div><label>Área plantada (ha)</label><input name="planted_area_hectares" type="number" step="0.01" min="0" required></div>
      <div><label>Umidade atual (%)</label><input name="humidity" type="number" min="0" max="100" required></div>
      <div><label>Umidade mín (%)</label><input name="min_humidity" type="number" min="0" max="100" required></div>
      <div><label>Umidade máx (%)</label><input name="max_humidity" type="number" min="0" max="100" required></div>
    </div>
    <button class="btn" type="submit">Salvar cultura</button>
  </form>`;
}

function tabDevices(){
  return `<div class="tipbox">Conecte placas <b>ESP32</b> na sua rede Wi-Fi e cadastre o IP local de cada uma. O firmware deve expor <code>GET /status</code> (moisture, battery, relay) e <code>POST /relay</code>. O navegador precisa estar na mesma rede Wi-Fi do ESP32.</div>
  <div class="row" style="margin-bottom:12px"><h3 style="margin:0">Dispositivos (${state.devices.length})</h3><button class="btn small" id="addDeviceBtn">+ Dispositivo</button></div>
  <div id="deviceForm" class="hidden">${deviceFormHtml()}</div>
  <div class="grid cols2">${state.devices.map(deviceCard).join('') || '<p class="muted">Nenhum dispositivo registrado.</p>'}</div>`;
}
function deviceFormHtml(){
  return `<form id="deviceFormEl" style="margin-bottom:14px">
    <label>Nome</label><input name="name" required placeholder="Ex: Sensor Talhão A">
    <label>Tipo</label><select name="type"><option value="sensor">Sensor de Umidade</option><option value="irrigator">Regador</option><option value="drainer">Drenador</option></select>
    <label>IP do ESP32</label><input name="ip_address" required placeholder="Ex: 192.168.1.50">
    <button class="btn" type="submit">Registrar</button>
  </form>`;
}
function deviceCard(d){
  return `<div class="card" id="dev-${d.id}">
    <div class="row"><b>${d.name}</b><span class="linklike" data-del-device="${d.id}">remover</span></div>
    <p class="muted" style="margin:2px 0">${d.type==='sensor'?'Sensor':d.type==='irrigator'?'Regador':'Drenador'} · ${d.ip_address}</p>
    <p class="muted" data-status="${d.id}">Desconectado</p>
    <div class="row">
      <button class="btn small secondary" data-connect="${d.id}">Conectar</button>
      ${d.type!=='sensor'?`<button class="btn small" data-toggle="${d.id}">Ligar/Desligar</button>`:''}
    </div>
  </div>`;
}

function tabFinance(){
  const rec=state.tx.reduce((s,t)=>t.type==='receita'?s+(+t.amount||0):s,0);
  const desp=state.tx.reduce((s,t)=>t.type==='despesa'?s+(+t.amount||0):s,0);
  return `<div class="grid cols3" style="margin-bottom:14px">
    <div class="stat"><span class="muted">Receitas</span><b style="color:var(--primary)">R$ ${rec.toFixed(2)}</b></div>
    <div class="stat"><span class="muted">Despesas</span><b style="color:var(--red)">R$ ${desp.toFixed(2)}</b></div>
    <div class="stat"><span class="muted">Saldo</span><b>R$ ${(rec-desp).toFixed(2)}</b></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Registrar movimentação</h3>
    <form id="txForm">
      <label>Descrição</label><input name="description" required>
      <div class="grid cols2">
        <div><label>Tipo</label><select name="type"><option value="despesa">Despesa</option><option value="receita">Receita</option></select></div>
        <div><label>Valor (R$)</label><input name="amount" type="number" step="0.01" min="0" required></div>
      </div>
      <label>Data</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required>
      <button class="btn" type="submit">Adicionar</button>
    </form>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Extrato</h3>
    ${state.tx.length===0?'<p class="muted">Nenhuma movimentação.</p>':state.tx.map(t=>`
      <div class="row" style="border-top:1px solid var(--border);padding:8px 0">
        <div><b>${t.description}</b><div class="muted">${t.date}</div></div>
        <div class="row" style="gap:12px">
          <span style="color:${t.type==='receita'?'var(--primary)':'var(--red)'};font-weight:600">${t.type==='receita'?'+':'-'} R$ ${(+t.amount).toFixed(2)}</span>
          <span class="linklike" data-del-tx="${t.id}">x</span>
        </div>
      </div>`).join('')}
  </div>`;
}

function tabCrops(){
  return `<div class="row" style="margin-bottom:12px"><h3 style="margin:0">Culturas por talhão</h3><button class="btn small" id="addCropBtn3">+ Cultura</button></div>
  <div id="cropForm3" class="hidden">${cropFormHtml()}</div>
  ${state.fields.map(f=>`
    <div class="card">
      <b>${f.name}</b> <span class="muted">· ${SOIL[f.soil_type]||f.soil_type} · ${f.region||''}</span>
      <div class="grid cols2" style="margin-top:10px">
        ${state.crops.filter(c=>c.field_id===f.id).map(c=>`<div class="row"><span>${c.name} · ${c.humidity}%</span><span class="linklike" data-del-crop="${c.id}">remover</span></div>`).join('') || '<span class="muted">Sem culturas.</span>'}
      </div>
    </div>`).join('') || '<p class="muted">Cadastre um talhão primeiro (aba Visão geral).</p>'}`;
}

function wire(){
  const farmForm = document.getElementById('farmForm');
  if(farmForm) farmForm.onsubmit = e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(farmForm)); state.farm={id:uid(),...d}; persist(); render(); };

  const wipe = document.getElementById('wipeLink');
  if(wipe) wipe.onclick = ()=>{ if(confirm('Apagar todos os dados salvos neste navegador?')){ try{localStorage.clear();}catch{} state={farm:null,fields:[],crops:[],devices:[],tx:[],tab:'overview'}; render(); } };

  document.querySelectorAll('nav.tabs button').forEach(b=> b.onclick = ()=>{ state.tab=b.dataset.tab; render(); });

  const toggle = (btnId, formId) => { const b=document.getElementById(btnId), f=document.getElementById(formId); if(b&&f) b.onclick=()=>f.classList.toggle('hidden'); };
  toggle('addFieldBtn','fieldForm'); toggle('addCropBtn2','cropForm2'); toggle('addCropBtn3','cropForm3'); toggle('addDeviceBtn','deviceForm');

  const fieldForm = document.getElementById('fieldFormEl');
  if(fieldForm) fieldForm.onsubmit = e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(fieldForm)); state.fields.push({id:uid(),...d}); persist(); render(); };

  document.querySelectorAll('.cropFormEl').forEach(f=> f.onsubmit = e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(f)); state.crops.push({id:uid(),...d}); persist(); render(); });

  const deviceForm = document.getElementById('deviceFormEl');
  if(deviceForm) deviceForm.onsubmit = e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(deviceForm)); state.devices.push({id:uid(),...d}); persist(); render(); };

  const txForm = document.getElementById('txForm');
  if(txForm) txForm.onsubmit = e=>{ e.preventDefault(); const d=Object.fromEntries(new FormData(txForm)); state.tx.unshift({id:uid(),...d}); persist(); render(); };

  document.querySelectorAll('[data-del-field]').forEach(x=> x.onclick=()=>{ state.fields=state.fields.filter(f=>f.id!==x.dataset.delField); persist(); render(); });
  document.querySelectorAll('[data-del-crop]').forEach(x=> x.onclick=()=>{ state.crops=state.crops.filter(c=>c.id!==x.dataset.delCrop); persist(); render(); });
  document.querySelectorAll('[data-del-device]').forEach(x=> x.onclick=()=>{ state.devices=state.devices.filter(d=>d.id!==x.dataset.delDevice); persist(); render(); });
  document.querySelectorAll('[data-del-tx]').forEach(x=> x.onclick=()=>{ state.tx=state.tx.filter(t=>t.id!==x.dataset.delTx); persist(); render(); });
  document.querySelectorAll('[data-resolve]').forEach(x=> x.onclick=()=>{ const c=state.crops.find(c=>c.id===x.dataset.resolve); if(c){ c.humidity=targetHumidity(c); persist(); render(); } });
  document.querySelectorAll('[data-humidity]').forEach(x=> x.onchange=()=>{ const c=state.crops.find(c=>c.id===x.dataset.humidity); if(c){ c.humidity=+x.value; persist(); } });

  document.querySelectorAll('[data-connect]').forEach(x=> x.onclick=async ()=>{
    const d=state.devices.find(d=>d.id===x.dataset.connect); if(!d) return;
    const statusEl=document.querySelector(`[data-status="${d.id}"]`);
    statusEl.textContent='Conectando…';
    try{
      const s=await espStatus(d.ip_address);
      statusEl.textContent = `Conectado · ${d.type==='sensor'?('umidade '+ (s.moisture??'?')+'%'):('relé '+(s.relay?'ligado':'desligado'))}`;
    }catch(e){ statusEl.textContent='Falha ao conectar: '+e.message; }
  });
  document.querySelectorAll('[data-toggle]').forEach(x=> x.onclick=async ()=>{
    const d=state.devices.find(d=>d.id===x.dataset.toggle); if(!d) return;
    const statusEl=document.querySelector(`[data-status="${d.id}"]`);
    try{ await espRelay(d.ip_address, true); statusEl.textContent='Comando enviado.'; }
    catch(e){ statusEl.textContent='Falha no comando: '+e.message; }
  });
}

render();
</script>
</body>
</html>
